[project]
name = "phishguard-rfxgb"
version = "0.1.0"
description = "Sistem deteksi phishing berbasis URL (Random Forest + XGBoost, dataset PhiUSIIL) dengan antarmuka web Reflex"
readme = "README.md"
authors = [
    { name = "Raka", email = "incudelta@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "reflex>=0.11.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
